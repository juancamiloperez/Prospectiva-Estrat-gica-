<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratorio de prospectiva · MICMAC y escenarios de Schwartz</title>
<meta name="description" content="Aplicación para realizar un ejercicio completo de prospectiva estratégica: variables, matriz MICMAC, plano de motricidad y dependencia, incertidumbres críticas y matriz de escenarios de Peter Schwartz.">
<style>
:root{
  --ink:#1F2F3A; --ink-2:#4A5B66; --ink-3:#7A8A93; --line:#DCE3E6; --wash:#F3F6F7; --paper:#FFFFFF;
  --poder:#B23A48; --enlace:#C98A12; --resultado:#2F7F78; --autonoma:#8C979C; --horizon:#2D4E8A;
  --poder-t:#F5DDE0; --enlace-t:#F8EBCF; --resultado-t:#D8ECEA; --autonoma-t:#E9EDEE;
  --serif: "Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--horizon);outline-offset:2px}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
aside{background:var(--ink);color:#E8EEF0;padding:28px 22px;position:sticky;top:0;height:100vh;overflow:auto}
aside h1{font-family:var(--serif);font-weight:600;font-size:1.45rem;line-height:1.2;margin:0 0 6px}
aside .sub{color:#A9B8BE;font-size:.88rem;margin:0 0 22px}
.dots{display:flex;gap:7px;margin-bottom:18px}.dots i{width:13px;height:13px;border-radius:50%;display:block}
nav ol{list-style:none;margin:0;padding:0;counter-reset:s}
nav li{counter-increment:s}
nav button{all:unset;cursor:pointer;display:grid;grid-template-columns:30px 1fr 16px;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;color:#C9D5D9;font-size:.95rem;box-sizing:border-box}
nav button::before{content:counter(s);width:28px;height:28px;border-radius:50%;border:1.5px solid #5E7480;display:grid;place-items:center;font-size:.82rem;font-variant-numeric:tabular-nums}
nav button[aria-current="step"]{background:#2C4250;color:#fff}
nav button[aria-current="step"]::before{background:#fff;color:var(--ink);border-color:#fff}
nav button .ok{width:16px;height:16px;border-radius:50%}
nav button .ok.done{background:var(--resultado)}
nav button:focus-visible{outline:3px solid #9DB8FF}
.side-actions{margin-top:24px;display:grid;gap:8px}
.side-actions button{background:transparent;border:1px solid #4E6572;color:#DDE6E9;border-radius:8px;padding:8px 10px;cursor:pointer;text-align:left;font-size:.9rem}
.side-actions button:hover{background:#2C4250}
.save{font-size:.8rem;color:#93A6AE;margin-top:14px}
main{padding:34px 44px 80px;max-width:1180px;width:100%}
header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:26px;flex-wrap:wrap}
header.top .proj{font-family:var(--serif);font-size:1.05rem;color:var(--ink-2)}
h2{font-family:var(--serif);font-weight:600;font-size:2.1rem;line-height:1.15;margin:0 0 8px}
h3{font-family:var(--serif);font-weight:600;font-size:1.3rem;margin:28px 0 10px}
p.lead{color:var(--ink-2);max-width:72ch;margin:0 0 22px;font-size:1.04rem}
.hint{background:var(--wash);border-radius:var(--r);padding:14px 18px;color:var(--ink-2);max-width:80ch;font-size:.95rem;margin:0 0 20px}
.hint b{color:var(--ink)}
label.f{display:block;font-weight:600;font-size:.92rem;margin:0 0 6px}
.field{margin-bottom:18px;max-width:720px}
input[type=text],input[type=number],select,textarea{width:100%;border:1px solid #C7D2D6;border-radius:8px;padding:9px 11px;background:#fff}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--horizon)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:900px}
.btn{border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600;background:var(--ink);color:#fff}
.btn.sec{background:var(--wash);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:#fff;color:var(--poder);border:1px solid #E6C4C9}
.btn:hover{filter:brightness(1.08)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:.85rem;color:var(--ink-2);font-weight:600;background:var(--wash)}
td input,td select,td textarea{padding:6px 8px}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r)}
.code{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.mid{border-collapse:separate;border-spacing:0}
.mid th,.mid td{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;padding:0;min-width:46px}
.mid th.rowh{text-align:left;padding:6px 10px;min-width:210px;position:sticky;left:0;background:#fff;z-index:1;font-weight:600;color:var(--ink)}
.mid thead th{padding:8px 4px;position:sticky;top:0;z-index:2}
.mid thead th.corner{left:0;z-index:3}
.mid input{width:46px;height:38px;border:0;border-radius:0;text-align:center;padding:0;font-variant-numeric:tabular-nums;background:transparent}
.mid input:focus{background:#E8EEFA;outline:2px solid var(--horizon);outline-offset:-2px}
.mid td.diag{background:#E3E8EA}
.mid td.v1 input{background:#EEF4F3}.mid td.v2 input{background:var(--enlace-t)}.mid td.v3 input{background:var(--poder-t);font-weight:700}
.mid .tot{font-weight:700;background:var(--wash);padding:0 8px}
.mid tr.hl th.rowh,.mid td.hlc{box-shadow:inset 0 0 0 9999px rgba(45,78,138,.07)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.88rem;color:var(--ink-2);margin:10px 0 16px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:50%;display:inline-block}
.chart{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:8px}
.chart svg{width:100%;height:auto;display:block}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;align-items:start}
.zone-card{border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.zone-card h4{margin:0 0 4px;font-family:var(--serif);font-size:1.08rem}
.zone-card p{margin:0;font-size:.92rem;color:var(--ink-2)}
.zone-card .vs{margin-top:6px;font-weight:600;font-size:.92rem}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.8rem;font-weight:600;color:#fff;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.err{color:var(--poder);font-size:.92rem;margin:8px 0}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:28px;color:var(--ink-2);text-align:center}
/* Schwartz */
.sch{display:grid;grid-template-columns:120px 1fr 1fr 120px;grid-template-rows:auto 1fr 1fr auto;gap:10px;margin-top:10px}
.sch .ax{display:flex;align-items:center;justify-content:center;text-align:center;font-weight:600;color:var(--ink-2);font-size:.9rem;padding:6px}
.sch .ax.top,.sch .ax.bot{grid-column:2 / span 2}
.quad{border-radius:var(--r);padding:14px;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;gap:8px;min-height:260px}
.quad .pos{font-size:.8rem;color:var(--ink-3)}
.quad input.qn{font-family:var(--serif);font-size:1.1rem;font-weight:600}
.quad textarea{min-height:120px;font-size:.92rem}
.quad.apuesta{background:#E9F3EF;border-color:#B9D9CF}.quad.adverso{background:#FBECEE;border-color:#EBC7CC}.quad.favorable{background:#F1F4F5}.quad.cubrimiento{background:#FCF4E4;border-color:#EFD9A9}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.methods{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:980px;margin:0 0 26px}
.mcard{border:2px solid var(--line);border-radius:14px;padding:18px 20px;background:#fff;display:flex;flex-direction:column;gap:10px}
.mcard[data-sel="true"]{border-color:var(--ink);box-shadow:0 0 0 3px #DDE5F3}
.mcard h4{margin:0;font-family:var(--serif);font-size:1.25rem}
.mcard p{margin:0;color:var(--ink-2);font-size:.94rem}
.mcard ol{margin:0;padding-left:20px;color:var(--ink-2);font-size:.92rem}
.mcard .row{margin-top:auto}
@media (max-width:900px){.methods{grid-template-columns:1fr}}
tr.vrow td{border-bottom:0;padding-bottom:4px}
.grade{display:flex;gap:28px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:14px;padding:20px 24px;margin:0 0 22px;max-width:980px}
.grade .big{font-family:var(--serif);font-size:3.6rem;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.grade .big small{font-size:1.3rem;color:var(--ink-3)}
.grade p{margin:4px 0 0;color:var(--ink-2);max-width:60ch}
.crit{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:0 0 14px;max-width:980px}
.crit header{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.crit h4{margin:0;font-family:var(--serif);font-size:1.12rem}
.bar{height:8px;background:var(--wash);border-radius:99px;overflow:hidden;margin:10px 0 12px}
.bar i{display:block;height:100%;border-radius:99px}
.fb{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fb h5{margin:0 0 6px;font-size:.88rem;color:var(--ink-2)}
.fb ul{margin:0;padding-left:18px;font-size:.92rem}
.fb li{margin-bottom:4px}
.fb .goodl li::marker{content:"✓  ";color:var(--resultado)}
.fb .fixl li::marker{content:"→  ";color:var(--poder)}
.modal-bg{position:fixed;inset:0;background:rgba(20,32,40,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:14px;padding:22px 24px;max-width:480px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.modal p{margin:0 0 18px}
.banner{border-radius:10px;padding:12px 16px;margin:0 0 18px;font-size:.95rem;max-width:980px}
.banner.warn{background:#FBECEE;color:#7A1F2B;border:1px solid #EBC7CC}
.banner.info{background:#E9EEF8;color:#1F3A6B;border:1px solid #C9D5EE}
.banner a{color:inherit;font-weight:700}
details.rub summary{cursor:pointer;font-weight:600;color:var(--horizon);margin:8px 0}
@media (max-width:900px){.fb{grid-template-columns:1fr}}
tr.ficha td{padding-top:0;padding-bottom:14px}
.ficha-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;background:var(--wash);border-radius:8px;padding:10px}
.ficha-grid label{display:block;font-size:.8rem;font-weight:600;color:var(--ink-2);margin:0 0 4px}
.ficha-grid textarea{min-height:72px;font-size:.9rem}
.ficha-tog{background:none;border:0;color:var(--horizon);cursor:pointer;font-weight:600;padding:4px 0;font-size:.9rem}
@media (max-width:900px){.ficha-grid{grid-template-columns:1fr 1fr}}
.chk{display:inline-flex;align-items:center;gap:4px;font-size:.88rem;margin-right:8px}
/* Report */
.report h3{border-top:1px solid var(--line);padding-top:18px}
.report .meta{color:var(--ink-2)}
.mini{font-size:.85rem}
.mini th,.mini td{padding:5px 6px}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto}
  nav ol{display:flex;overflow:auto;gap:4px}
  nav button{grid-template-columns:30px auto;white-space:nowrap}
  nav button .ok{display:none}
  main{padding:22px 16px 60px}
  .two,.grid2{grid-template-columns:1fr}
  .sch{grid-template-columns:1fr;grid-template-rows:auto}
  .sch .ax.top,.sch .ax.bot{grid-column:auto}
  .sch .ax.side{display:none}
}
@media print{
  aside,header.top .row,.noprint{display:none!important}
  .app{display:block} main{padding:0;max-width:none}
  section[hidden]{display:none!important}
  .quad{break-inside:avoid} h3{break-after:avoid}
}
@media (prefers-reduced-motion:no-preference){ .fade{animation:f .25s ease-out} @keyframes f{from{opacity:0}to{opacity:1}} }
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="dots" aria-hidden="true"><i style="background:var(--poder)"></i><i style="background:var(--enlace)"></i><i style="background:var(--resultado)"></i><i style="background:var(--autonoma)"></i></div>
  <h1>Laboratorio de prospectiva</h1>
  <p class="sub">De las variables a los escenarios: MICMAC y matriz de Peter Schwartz</p>
  <nav aria-label="Pasos del ejercicio"><ol id="steps"></ol></nav>
  <div class="side-actions">
    <button id="bExample">Cargar ejemplo resuelto</button>
    <button id="bExport">Descargar mi trabajo (.json)</button>
    <button id="bImport">Abrir un trabajo guardado</button>
    <button id="bReset">Empezar de cero</button>
    <button id="bTeacher">Modo docente: revisar trabajos</button>
    <input type="file" id="fTeacher" accept=".json,application/json" multiple hidden>
    <input type="file" id="fImport" accept=".json,application/json" hidden>
  </div>
  <p class="save" id="saveState" role="status"></p>
</aside>
<main>
  <header class="top">
    <div class="proj" id="projLine"></div>
    <div class="row"><button class="btn sec" id="bPrev">Paso anterior</button><button class="btn" id="bNext">Siguiente paso</button></div>
  </header>
  <div id="view"></div>
</main>
</div>
<script>
"use strict";
/* ---------- Estado ---------- */
const ROUTES={
 frances:[{id:"proyecto",t:"Proyecto y método"},{id:"variables",t:"Variables"},{id:"matriz",t:"Matriz de influencias"},{id:"plano",t:"Plano MICMAC"},
  {id:"incert",t:"Incertidumbres críticas"},{id:"schwartz",t:"Matriz de Schwartz"},{id:"estrategias",t:"Estrategias e indicadores"},{id:"rubrica",t:"Rúbrica y retroalimentación"},{id:"informe",t:"Informe final"}],
 anglo:[{id:"proyecto",t:"Proyecto y método"},{id:"variables",t:"Variables"},{id:"calif",t:"Calificación"},{id:"grafico",t:"Mapa impacto-incertidumbre"},
  {id:"schwartz",t:"Matriz de Schwartz"},{id:"estrategias",t:"Estrategias e indicadores"},{id:"rubrica",t:"Rúbrica y retroalimentación"},{id:"informe",t:"Informe final"}],
 none:[{id:"proyecto",t:"Proyecto y método"}]};
const METHODS={frances:"Escuela francesa (MICMAC)",anglo:"Escuela anglosajona (Peter Schwartz)"};
let STEPS=ROUTES.none;
const setRoute=()=>{STEPS=ROUTES[S.method]||ROUTES.none;if(S.step>=STEPS.length)S.step=0;};
const KEY="labprospectiva_v1";
const QPOS={q1:"Arriba a la derecha",q2:"Arriba a la izquierda",q3:"Abajo a la izquierda",q4:"Abajo a la derecha"};
const ROLES=[["","Sin definir"],["apuesta","Escenario apuesta"],["favorable","Favorable"],["adverso","Adverso"],["cubrimiento","De cubrimiento"]];
const blank=()=>({method:"",fichas:true,meta:{estudiante:"",empresa:"",sector:"",pregunta:"",horizonte:"",descripcion:""},vars:[],M:[],
  thr:{imp:4,unc:4,med:3},axes:{x:"",y:"",xNeg:"",xPos:"",yNeg:"",yPos:""},
  esc:{q1:{n:"",rol:"",narr:"",ganar:""},q2:{n:"",rol:"",narr:"",ganar:""},q3:{n:"",rol:"",narr:"",ganar:""},q4:{n:"",rol:"",narr:"",ganar:""}},
  estr:[],ind:[],step:0});
let S=blank();
function norm(d){const b=blank();const o=Object.assign(b,d);if(!o.method&&Array.isArray(d.M)&&d.M.some(r=>Array.isArray(r)&&r.some(x=>+x>0)))o.method="frances";o.thr=Object.assign({imp:4,unc:4,med:3},d.thr||{});o.ind=(o.ind||[]).map(x=>({eje:x.eje||"",t:x.t||"",s:x.s||"",h:x.h!=null?x.h:(x.q?{q1:"Escenario arriba a la derecha",q2:"Escenario arriba a la izquierda",q3:"Escenario abajo a la izquierda",q4:"Escenario abajo a la derecha"}[x.q]:""),u:x.u||""}));o.vars=(o.vars||[]).map(v=>Object.assign({kind:"",ind:"",imp:0,impMan:"",unc:0,desc:"",type:"Externa",def:"",pas:"",pre:"",fut:""},v));o.fichas=d.fichas!==false;return o;}
function load(){try{const raw=localStorage.getItem(KEY); if(raw){S=norm(JSON.parse(raw));}}catch(e){}}
let saveTimer=null;
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S));msg("Guardado en este navegador · "+new Date().toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"}));}catch(e){msg("No se pudo guardar en el navegador. Descarga tu trabajo para no perderlo.");}},300);}
const msg=t=>document.getElementById("saveState").textContent=t;
function ask(text,ok="Aceptar",cancel="Cancelar"){return new Promise(res=>{const bg=document.createElement("div");bg.className="modal-bg";
 bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><p>${esc(text)}</p><div class="row" style="justify-content:flex-end">${cancel?`<button class="btn sec" data-r="0">${esc(cancel)}</button>`:""}<button class="btn" data-r="1">${esc(ok)}</button></div></div>`;
 document.body.appendChild(bg);const close=v=>{bg.remove();res(v);};bg.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>close(b.dataset.r==="1"));
 bg.addEventListener("keydown",e=>{if(e.key==="Escape")close(false);});bg.querySelector('[data-r="1"]').focus();});}
const tell=t=>ask(t,"Entendido",null);
const STORAGE_OK=(()=>{try{localStorage.setItem("__t","1");localStorage.removeItem("__t");return true;}catch(e){return false;}})();
const IN_FRAME=(()=>{try{return window.self!==window.top;}catch(e){return true;}})();
window.addEventListener("pagehide",()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);

/* ---------- Cálculos ---------- */
function motDep(M){const n=M.length;const mot=M.map(r=>r.reduce((a,b)=>a+(+b||0),0));const dep=Array.from({length:n},(_,j)=>M.reduce((a,r)=>a+(+r[j]||0),0));return{mot,dep};}
function square(M){const n=M.length;return M.map((r,i)=>Array.from({length:n},(_,j)=>{let s=0;for(let k=0;k<n;k++)s+=(+M[i][k]||0)*(+M[k][j]||0);return s;}));}
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function zones(mot,dep){const mm=avg(mot),dm=avg(dep);return{mm,dm,z:mot.map((m,i)=>m>=mm&&dep[i]<dm?"poder":m>=mm?"enlace":dep[i]>=dm?"resultado":"autonoma")};}
const ZN={poder:"Poder (motriz)",enlace:"Enlace (estratégica)",resultado:"Resultado (dependiente)",autonoma:"Autónoma"};
const ZACT={poder:"Anticipar",enlace:"Intervenir",resultado:"Medir",autonoma:"Vigilar"};
function ranks(a){return a.map(v=>1+a.filter(x=>x>v).length);}
function impacts(){if(S.method==="anglo")return S.vars.map(v=>+v.imp||0);const {mot}=motDep(S.M);const mn=Math.min(...mot),mx=Math.max(...mot);
  return S.vars.map((v,i)=>v.impMan?+v.impMan:(mx===mn?3:Math.round(1+4*(mot[i]-mn)/(mx-mn))));}
function classUnc(I,U){return I>=S.thr.imp&&U>=S.thr.unc?"Incertidumbre crítica":I>=S.thr.imp&&U>=S.thr.med?"Candidata (eje alterno)":I>=S.thr.imp?"Elemento predeterminado":U>=S.thr.unc?"Incierta de bajo impacto":"Secundaria";}
const CCOL={"Incertidumbre crítica":"#C98A12","Candidata (eje alterno)":"#7A5BA8","Elemento predeterminado":"#B23A48","Incierta de bajo impacto":"#2D4E8A","Secundaria":"#8C979C"};
function suggestAxes(){const I=impacts();const c=S.vars.map((v,i)=>({i,s:I[i]*(+v.unc||0),crit:v.type!=="Interna"&&I[i]>=S.thr.imp&&(+v.unc||0)>=S.thr.unc})).filter(x=>x.crit).sort((a,b)=>b.s-a.s);return c.slice(0,2).map(x=>S.vars[x.i].id);}
const varById=id=>S.vars.find(v=>v.id===id);
function nextCode(){let k=1;while(S.vars.some(v=>v.code==="V"+k))k++;return"V"+k;}
const uid=()=>Math.random().toString(36).slice(2,9);

/* ---------- Gráfico de cuadrantes (SVG) ---------- */
function quadSVG(o){
 // o: pts[{label,x,y,color,title}], xmax,ymax,xv,yh,xl,yl,q:{tl,tr,bl,br}, tints
 const W=720,H=470,L=58,R=18,T=18,B=52,pw=W-L-R,ph=H-T-B;
 const X=v=>L+v/o.xmax*pw, Y=v=>T+ph-v/o.ymax*ph;
 const xv=X(o.xv),yh=Y(o.yh);
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria)}">`;
 const t=o.tints;
 s+=`<rect x="${L}" y="${T}" width="${xv-L}" height="${yh-T}" fill="${t.tl}"/><rect x="${xv}" y="${T}" width="${L+pw-xv}" height="${yh-T}" fill="${t.tr}"/>`;
 s+=`<rect x="${L}" y="${yh}" width="${xv-L}" height="${T+ph-yh}" fill="${t.bl}"/><rect x="${xv}" y="${yh}" width="${L+pw-xv}" height="${T+ph-yh}" fill="${t.br}"/>`;
 const xt=o.xticks,yt=o.yticks;

 yt.forEach(v=>{s+=`<line x1="${L}" y1="${Y(v)}" x2="${L+pw}" y2="${Y(v)}" stroke="#fff" stroke-width="1"/><text x="${L-8}" y="${Y(v)+4}" font-size="12" text-anchor="end" fill="#4A5B66">${v}</text>`;});
 s+=`<line x1="${xv}" y1="${T}" x2="${xv}" y2="${T+ph}" stroke="#B23A48" stroke-width="1.6" stroke-dasharray="6 5"/><line x1="${L}" y1="${yh}" x2="${L+pw}" y2="${yh}" stroke="#B23A48" stroke-width="1.6" stroke-dasharray="6 5"/>`;
 s+=`<line x1="${L}" y1="${T+ph}" x2="${L+pw}" y2="${T+ph}" stroke="#7A8A93"/><line x1="${L}" y1="${T}" x2="${L}" y2="${T+ph}" stroke="#7A8A93"/>`;
 const q=o.q, qs=`font-size="13" font-weight="700"`;
 s+=`<text x="${L+10}" y="${T+20}" ${qs} fill="${q.tl[1]}">${esc(q.tl[0])}</text><text x="${L+pw-10}" y="${T+20}" ${qs} text-anchor="end" fill="${q.tr[1]}">${esc(q.tr[0])}</text>`;
 s+=`<text x="${L+10}" y="${T+ph-10}" ${qs} fill="${q.bl[1]}">${esc(q.bl[0])}</text><text x="${L+pw-10}" y="${T+ph-10}" ${qs} text-anchor="end" fill="${q.br[1]}">${esc(q.br[0])}</text>`;
 s+=`<text x="${L+pw/2}" y="${H-10}" font-size="13" text-anchor="middle" fill="#1F2F3A" font-weight="600">${esc(o.xl)} →</text>`;
 s+=`<text x="16" y="${T+ph/2}" font-size="13" text-anchor="middle" fill="#1F2F3A" font-weight="600" transform="rotate(-90 16 ${T+ph/2})">${esc(o.yl)} →</text>`;
 const groups={};o.pts.forEach(p=>{const k=p.x+"|"+p.y;(groups[k]=groups[k]||[]).push(p);});
 Object.values(groups).forEach(g=>{const p=g[0];const cx=X(Math.min(p.x,o.xmax)),cy=Y(Math.min(p.y,o.ymax));
   s+=`<g><title>${esc(g.map(z=>z.title).join("\n"))}</title><circle cx="${cx}" cy="${cy}" r="8" fill="${p.color}" stroke="#fff" stroke-width="2"/>`;
   const lab=g.map(z=>z.label).join(", ");const right=cx<L+pw-90;

 return s+"</svg>";
}
function niceMax(v){const m=Math.max(4,v);const step=m<=12?2:m<=30?4:m<=80?10:m<=200?25:50;return {max:Math.ceil((m*1.18+1)/step)*step,step};}
function micmacSVG(indirect){
 const M=indirect?square(S.M):S.M;const {mot,dep}=motDep(M);const Z=zones(mot,dep);
 const xm=niceMax(Math.max(...dep,1)),ym=niceMax(Math.max(...mot,1));
 const ticks=(m)=>{const a=[];for(let v=0;v<=m.max;v+=m.step)a.push(v);return a;};
 const col={poder:"#B23A48",enlace:"#C98A12",resultado:"#2F7F78",autonoma:"#8C979C"};
 return quadSVG({aria:"Plano de motricidad y dependencia",pts:S.vars.map((v,i)=>({label:v.code,x:dep[i],y:mot[i],color:col[Z.z[i]],title:`${v.code} ${v.name}: motricidad ${mot[i]}, dependencia ${dep[i]} (${ZN[Z.z[i]]})`})),
  xmax:xm.max,ymax:ym.max,xv:Z.dm,yh:Z.mm,xticks:ticks(xm),yticks:ticks(ym),xl:"Dependencia",yl:"Motricidad",
  q:{tl:["Poder",col.poder],tr:["Enlace",col.enlace],bl:["Autónomas","#5E6B70"],br:["Resultado",col.resultado]},
  tints:{tl:"#F8E6E8",tr:"#FAF0DA",bl:"#EEF1F2",br:"#E1F0EE"}});
}
function uncSVG(){
 const I=impacts();
 return quadSVG({aria:"Impacto contra incertidumbre",pts:S.vars.map((v,i)=>{const U=+v.unc||0;const c=classUnc(I[i],U);
   return{label:v.code,x:U,y:I[i],color:CCOL[c],title:`${v.code} ${v.name}: impacto ${I[i]}, incertidumbre ${U} (${c})`};}),

  q:{tl:["Elementos predeterminados","#B23A48"],tr:["Incertidumbres críticas","#9A6A0E"],bl:["Secundarias","#5E6B70"],br:["Inciertas, bajo impacto","#2D4E8A"]},
  tints:{tl:"#F8E6E8",tr:"#FAF0DA",bl:"#EEF1F2",br:"#E5EBF5"}});
}

/* ---------- Validaciones por paso ---------- */
function stepDone(i){
 switch(STEPS[i].id){
  case"proyecto":return !!(S.method&&S.meta.empresa&&S.meta.pregunta);
  case"variables":return S.vars.length>=(S.method==="anglo"?4:6)&&S.vars.every(v=>v.name);
  case"matriz":return S.vars.length>=6&&S.M.some(r=>r.some(x=>+x>0));
  case"plano":return S.vars.length>=6&&S.M.some(r=>r.some(x=>+x>0));
  case"incert":return S.vars.length>0&&S.vars.every(v=>+v.unc>0);
  case"schwartz":return !!(S.axes.x&&S.axes.y&&S.axes.x!==S.axes.y&&["q1","q2","q3","q4"].every(k=>S.esc[k].n));
  case"estrategias":return S.estr.length>0&&S.ind.length>0;
  case"calif":return S.vars.length>0&&S.vars.every(v=>+v.unc>0&&+v.imp>0);
  case"grafico":return S.vars.length>0&&S.vars.every(v=>+v.unc>0&&+v.imp>0)&&suggestAxes().length===2;
  case"informe":case"rubrica":return false;}
}

V.schwartz=()=>{
 if(S.vars.length<2)return `<h2>Matriz de Schwartz</h2><div class="empty">Primero agrega variables.</div>`;
 const sug=suggestAxes();const ax=S.axes;const opt=sel=>`<option value="">Elige una variable</option>`+S.vars.map(v=>`<option value="${v.id}" ${sel===v.id?"selected":""}>${esc(v.code+" "+v.name)}${sug.includes(v.id)?" (sugerida)":""}</option>`).join("");
 const X=varById(ax.x),Y=varById(ax.y);const same=ax.x&&ax.x===ax.y;
 const I=impacts();const pre=S.vars.filter((v,i)=>v.type!=="Interna"&&+v.unc&&classUnc(I[i],+v.unc)==="Elemento predeterminado");
 const quad=k=>{const e=S.esc[k];const combo={q1:[ax.yPos,ax.xPos],q2:[ax.yPos,ax.xNeg],q3:[ax.yNeg,ax.xNeg],q4:[ax.yNeg,ax.xPos]}[k];
  return `<div class="quad ${e.rol}"><span class="pos">${QPOS[k]}: ${esc(combo[0]||"polo vertical")} + ${esc(combo[1]||"polo horizontal")}</span>
  <input type="text" class="qn" aria-label="Nombre del escenario ${QPOS[k]}" placeholder="Nombre del escenario" data-q="${k}" data-qk="n" value="${esc(e.n)}">
  <select aria-label="Rol del escenario" data-q="${k}" data-qk="rol">${ROLES.map(r=>`<option value="${r[0]}" ${e.rol===r[0]?"selected":""}>${r[1]}</option>`).join("")}</select>
  <textarea aria-label="Narrativa" placeholder="Narrativa contada desde el año horizonte: qué pasó y por qué" data-q="${k}" data-qk="narr">${esc(e.narr)}</textarea>
  <textarea aria-label="Qué se necesita para ganar" placeholder="Qué necesita la organización para ganar en este escenario" data-q="${k}" data-qk="ganar" style="min-height:60px">${esc(e.ganar)}</textarea></div>`;};
 return `<h2>Matriz de Schwartz</h2>
<p class="lead">Elige las dos incertidumbres críticas como ejes, define sus dos polos extremos y narra los cuatro escenarios que resultan de combinarlos.</p>
<div class="grid2">
 <div class="field"><label class="f" for="axX">Eje horizontal</label><select id="axX" data-ax="x">${opt(ax.x)}</select>
  <div class="row" style="margin-top:8px"><input type="text" aria-label="Polo izquierdo" placeholder="Polo izquierdo (ej. aplicación flexible)" data-ax="xNeg" value="${esc(ax.xNeg)}"><input type="text" aria-label="Polo derecho" placeholder="Polo derecho (ej. exigencia plena)" data-ax="xPos" value="${esc(ax.xPos)}"></div></div>
 <div class="field"><label class="f" for="axY">Eje vertical</label><select id="axY" data-ax="y">${opt(ax.y)}</select>
  <div class="row" style="margin-top:8px"><input type="text" aria-label="Polo inferior" placeholder="Polo inferior (ej. precio bajo)" data-ax="yNeg" value="${esc(ax.yNeg)}"><input type="text" aria-label="Polo superior" placeholder="Polo superior (ej. precio alto)" data-ax="yPos" value="${esc(ax.yPos)}"></div></div>
</div>
${same?`<p class="err" role="alert">Los dos ejes deben ser variables distintas.</p>`:""}
${[X,Y].some(v=>v&&v.type==="Interna")?`<p class="err" role="alert">Uno de los ejes es una variable interna. En Schwartz los ejes deben ser del entorno: lo interno va en las estrategias.</p>`:""}
<p class="mini" style="color:var(--ink-2)">Prueba de independencia: ¿puede moverse un eje sin que el otro se mueva? Si uno arrastra al otro, cambia un eje.</p>
<div class="sch">
 <div></div><div class="ax top">↑ ${esc(Y?Y.code+" "+Y.name:"Eje vertical")}: ${esc(ax.yPos||"polo superior")}</div><div></div>
 <div class="ax side">← ${esc(ax.xNeg||"polo izquierdo")}</div>${quad("q2")}${quad("q1")}<div class="ax side">${esc(ax.xPos||"polo derecho")} →<br>${esc(X?X.code+" "+X.name:"")}</div>
 <div class="ax side"></div>${quad("q3")}${quad("q4")}<div class="ax side"></div>
 <div></div><div class="ax bot">↓ ${esc(ax.yNeg||"polo inferior")}</div><div></div>
</div>
<h3>Elementos predeterminados del entorno (presentes en los cuatro escenarios)</h3>
<p>${pre.length?pre.map(v=>`<span class="code">${esc(v.code)}</span> ${esc(v.name)}`).join(" · "):"Ninguno todavía. Califica la incertidumbre en el paso 5."}</p>`;};

 document.querySelectorAll("[data-ax]").forEach(el=>el[el.tagName==="SELECT"?"onchange":"oninput"]=()=>{S.axes[el.dataset.ax]=el.value;save();if(el.tagName==="SELECT")render();else renderNav();});
 document.querySelectorAll("[data-q]").forEach(el=>el[el.tagName==="SELECT"?"onchange":"oninput"]=()=>{S.esc[el.dataset.q][el.dataset.qk]=el.value;save();if(el.tagName==="SELECT")render();else renderNav();});

/* ---------- Rúbrica automática ---------- */
const LEVELS=[[0.9,"Excelente","#2F7F78"],[0.7,"Bueno","#3E7CB1"],[0.5,"Aceptable","#C98A12"],[0,"Insuficiente","#B23A48"]];
const lvl=x=>LEVELS.find(l=>x>=l[0]);
const txt=t=>String(t??"").trim();
const junk=t=>{t=txt(t).toLowerCase();return t.length<3||/^(.)\1+$/.test(t.replace(/\s/g,""))||/^(xxx+|asd+|test|prueba|n\/?a|na|ninguno|nada|ok|sdf+|qwe+)$/.test(t);};
const ratio=(arr,f)=>arr.length?arr.filter(f).length/arr.length:0;
const hasYear=t=>/\b(19|20)\d{2}\b/.test(t||"");
const deacc=t=>txt(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const words=t=>deacc(t).split(/[^a-zñ]+/).filter(w=>w.length>=5);
function evalRubric(){
 const vars=S.vars,n=vars.length,fr=S.method==="frances",out=[];
 const crit=(id,name,w,step,checks)=>{let sc=0,good=[],fix=[];checks.forEach(([wt,val,g,f])=>{const v=Math.max(0,Math.min(1,val));sc+=wt*v;(v>=0.99?good:fix).push(v>=0.99?g:f);});out.push({id,name,w,step,score:Math.round(sc*100)/100,good,fix});};
 const m=S.meta;
 crit("proy","Proyecto y pregunta focal",10,"proyecto",[
  [0.2,!junk(m.empresa)?1:0,"La organización está identificada.","Escribe el nombre de la organización que estudias."],
  [0.15,!junk(m.horizonte)?1:0,"Definiste el horizonte de tiempo.","Define el horizonte (por ejemplo, 2026 – 2031)."],
  [0.3,txt(m.pregunta).length>=60?1:txt(m.pregunta).length>=30?0.5:0,"La pregunta focal es suficientemente específica.","Amplía la pregunta focal: debe nombrar la organización, la decisión que se quiere tomar y el horizonte."],
  [0.1,/[¿?]/.test(m.pregunta)?1:0,"La pregunta focal está formulada como pregunta.","Formula la pregunta focal entre signos de interrogación."],
  [0.15,hasYear(m.pregunta)?1:0,"La pregunta incluye el año horizonte.","Incluye en la pregunta el año horizonte (por ejemplo, «de aquí a 2031»)."],
  [0.1,txt(m.descripcion).length>=40?1:0,"Describiste la organización.","Agrega una descripción breve de la organización: qué hace, tamaño, mercado."]]);
 const names=vars.map(v=>deacc(v.name));const validN=ratio(vars,(v,i)=>!junk(v.name)&&names.indexOf(names[i])===i);
 const ext=ratio(vars,v=>v.type!=="Interna"),hasInt=vars.some(v=>v.type==="Interna"),hasExt=vars.some(v=>v.type!=="Interna");
 crit("vars","Inventario de variables",15,"variables",[
  [0.35,n>=8&&n<=20?1:n>=6?0.6:n>=4?0.3:0,`Tienes ${n} variables, una cantidad adecuada.`,n>20?`Tienes ${n} variables: agrupa las parecidas para quedar entre 8 y 20.`:`Tienes ${n} variables: lo recomendado es entre 8 y 20.`],
  [0.2,validN,"Todas las variables tienen un nombre claro y no repetido.","Revisa los nombres: hay variables sin nombre, repetidas o con texto de relleno (como «xxx»)."],
  [0.15,ratio(vars,v=>v.kind),"Clasificaste cada variable como tendencia, factor de cambio o hecho portador.","Indica la clase de cada variable: tendencia, factor de cambio o hecho portador de futuro."],
  [0.1,fr?(hasInt&&hasExt?1:0.4):(ext>=0.7?1:ext>=0.5?0.5:0),fr?"Incluiste variables internas y externas, como pide el método francés.":"La mayoría de tus variables son del entorno, como pide el método anglosajón.",fr?"El método francés estudia el sistema completo: incluye variables internas y externas.":"En el método anglosajón la mayoría de variables deben ser del entorno (externas)."],
  [0.1,ratio(vars,v=>txt(v.desc).length>=10),"Documentaste el origen de cada variable.","Completa el origen o la descripción de cada variable."],
  [0.1,ratio(vars,v=>txt(v.ind).length>=5),"Cada variable tiene un indicador para medirla.","Agrega un indicador medible para cada variable."]]);
 const fp=v=>[v.pas,v.pre,v.fut].filter(x=>txt(x).length>=15).length/3;
 crit("fichas","Fichas: definición, pasado, presente y futuro",10,"variables",[
  [0.4,ratio(vars,v=>txt(v.def).length>=15),"Definiste cada variable.","Escribe la definición de cada variable en su ficha."],
  [0.4,n?vars.reduce((a,v)=>a+fp(v),0)/n:0,"Describiste la evolución (pasado, presente y futuro) de cada variable.","Completa el pasado, el presente y el posible futuro de cada variable."],
  [0.2,ratio(vars,v=>hasYear(v.pas)||hasYear(v.pre)),"Tus fichas incluyen datos con año.","Respalda el pasado y el presente con datos fechados (por ejemplo, «en 2020…», «en 2026…») y su fuente."]]);
 const I=impacts(),U=vars.map(v=>+v.unc||0);
 if(fr){const off=n*(n-1);let nz=0,vals=new Set();S.M.forEach((r,i)=>r.forEach((x,j)=>{if(i!==j&&+x>0){nz++;vals.add(+x);}}));const d=off?nz/off:0;
  const {mot,dep}=motDep(S.M);const iso=vars.filter((v,i)=>mot[i]+dep[i]===0).map(v=>v.code);const sd=Math.sqrt(avg(mot.map(x=>(x-avg(mot))**2)));
  crit("mid","Matriz de influencias (MICMAC)",15,"matriz",[
   [0.35,d>=0.15&&d<=0.6?1:d>0.6&&d<=0.8?0.5:d>0.05&&d<0.15?0.5:0,`La matriz tiene una densidad razonable (${Math.round(d*100)}% de celdas con influencia).`,d>0.6?`El ${Math.round(d*100)}% de las celdas tiene influencia: probablemente estás calificando influencias indirectas. Califica solo las directas.`:`Solo el ${Math.round(d*100)}% de las celdas tiene influencia: revisa si faltan relaciones directas.`],
   [0.2,vals.size>=3?1:vals.size===2?0.5:0,"Usaste toda la escala (débil, moderada y fuerte).","Usa toda la escala: distingue influencias débiles (1), moderadas (2) y fuertes (3)."],
   [0.25,n&&!iso.length?1:0,"Todas las variables están conectadas con el sistema.",`Las variables ${iso.join(", ")} no influyen ni dependen de ninguna: revisa su calificación o sácalas.`],
   [0.2,sd>=1?1:0,"La matriz discrimina: unas variables son más motrices que otras.","Todas las variables tienen casi la misma motricidad: la matriz no discrimina. Revisa las calificaciones."]]);}
 else crit("calif","Calificación de impacto e incertidumbre",15,"calif",[
   [0.4,ratio(vars,(v,i)=>I[i]&&U[i]),"Calificaste todas las variables.","Califica impacto e incertidumbre de todas las variables."],
   [0.15,new Set(I.filter(Boolean)).size>=3?1:0.3,"El impacto discrimina entre variables.","Usa más valores de la escala de impacto: no todas las variables pesan igual."],
   [0.15,new Set(U.filter(Boolean)).size>=3?1:0.3,"La incertidumbre discrimina entre variables.","Usa más valores de la escala de incertidumbre."],
   [0.3,ratio(I.filter(Boolean),x=>x>=S.thr.imp)<=0.7?1:0.3,"No calificaste todo como de alto impacto: hay criterio de priorización.","Calificaste casi todo como de alto impacto. Prioriza: solo unas pocas variables deben serlo."]]);
 const cls=vars.map((v,i)=>U[i]&&I[i]?classUnc(I[i],U[i]):"");
 const critExt=vars.filter((v,i)=>cls[i]==="Incertidumbre crítica"&&v.type!=="Interna").length;
 crit("inc","Incertidumbres críticas y elementos predeterminados",10,fr?"incert":"grafico",[
  [0.5,critExt>=2?1:critExt===1?0.4:0,`Identificaste ${critExt} incertidumbres críticas del entorno.`,"Necesitas al menos dos incertidumbres críticas del entorno para construir la matriz de Schwartz."],
  [0.25,cls.includes("Elemento predeterminado")?1:0,"Identificaste elementos predeterminados (estarán en todos los escenarios).","Identifica al menos un elemento predeterminado: alto impacto y baja incertidumbre."],
  [0.25,fr?ratio(vars,v=>+v.unc):(new Set(cls.filter(Boolean)).size>=3?1:0.4),fr?"Calificaste la incertidumbre de todas las variables.":"Las variables se reparten en varias categorías.",fr?"Califica la incertidumbre de todas las variables.":"Casi todas las variables quedaron en la misma categoría: revisa la calificación."]]);
 const X=varById(S.axes.x),Y=varById(S.axes.y),ax=S.axes;const ix=vars.indexOf(X),iy=vars.indexOf(Y);
 const axc=i=>i<0?0:cls[i]==="Incertidumbre crítica"?1:cls[i]==="Candidata (eje alterno)"?0.5:0;
 const poles=[ax.xNeg,ax.xPos,ax.yNeg,ax.yPos];
 crit("ejes","Ejes de la matriz de Schwartz",10,"schwartz",[
  [0.3,X&&Y&&X!==Y?1:0,"Elegiste dos ejes distintos.","Elige dos variables distintas como ejes."],
  [0.2,X&&Y?((X.type!=="Interna")+(Y.type!=="Interna"))/2:0,"Los dos ejes son variables del entorno.","Un eje es una variable interna: en Schwartz los ejes deben ser del entorno; lo interno va en las estrategias."],
  [0.25,(axc(ix)+axc(iy))/2,"Los ejes son incertidumbres críticas.","Usa como ejes las incertidumbres críticas (alto impacto y alta incertidumbre)."],
  [0.15,ratio(poles,p=>!junk(p)),"Definiste los cuatro polos.","Define los dos polos extremos de cada eje."],
  [0.1,new Set(poles.map(deacc).filter(Boolean)).size===4?1:0,"Los polos son distintos entre sí.","Los polos de un eje deben ser opuestos y distintos."]]);
 const Q=["q1","q2","q3","q4"],E=Q.map(k=>S.esc[k]);
 const combo={q1:[ax.yPos,ax.xPos],q2:[ax.yPos,ax.xNeg],q3:[ax.yNeg,ax.xNeg],q4:[ax.yNeg,ax.xPos]};
 const coh=Q.map(k=>{const nar=deacc(S.esc[k].narr+" "+S.esc[k].n+" "+S.esc[k].ganar);const hits=combo[k].filter(p=>words(p).some(w=>new RegExp("\\b"+w.slice(0,4)).test(nar)));return hits.length/2;});
 const roles=E.map(e=>e.rol);
 crit("esc","Escenarios",20,"schwartz",[
  [0.15,new Set(E.map(e=>deacc(e.n)).filter(x=>x&&!junk(x))).size/4,"Los cuatro escenarios tienen nombres distintos.","Ponle a cada escenario un nombre propio y evocador."],
  [0.4,avg(E.map(e=>txt(e.narr).length>=150?1:txt(e.narr).length>=60?0.5:0)),"Las narrativas están desarrolladas.","Desarrolla las narrativas: cuenta qué pasó, por qué y cómo afecta a la organización (al menos tres o cuatro frases)."],
  [0.15,avg(E.map(e=>txt(e.ganar).length>=15?1:0)),"Indicaste qué se necesita para ganar en cada escenario.","Indica qué necesita la organización para ganar en cada escenario."],
  [0.1,roles.filter(r=>r==="apuesta").length===1?1:0,"Elegiste un escenario apuesta.",roles.includes("apuesta")?"Debe haber un solo escenario apuesta.":"Marca cuál es el escenario apuesta."],
  [0.1,roles.some(r=>r==="adverso"||r==="cubrimiento")?1:0,"Reconociste un escenario adverso o de cubrimiento.","Identifica al menos un escenario adverso o de cubrimiento: la estrategia debe protegerse de él."],
  [0.1,avg(coh),"Las narrativas mencionan los polos de su cuadrante.",`Sugerencia: haz explícito en la narrativa de cada escenario la combinación de polos de su cuadrante${coh.some(c=>c<1)?" (revisa: "+Q.filter((k,i)=>coh[i]<1).map(k=>QPOS[k].toLowerCase()).join("; ")+")":""}.`]]);
 const rob=S.estr.filter(e=>e.tipo==="Robusta"&&!junk(e.t)),con=S.estr.filter(e=>e.tipo==="Contingente"&&!junk(e.t));
 crit("estr","Estrategias e indicadores",10,"estrategias",[
  [0.25,rob.some(e=>(e.q||[]).length===4)?1:rob.length?0.4:0,"Tienes estrategias robustas que sirven en los cuatro escenarios.",rob.length?"Una estrategia robusta debe aplicar en los cuatro escenarios: márcalos todos o cámbiala a contingente.":"Agrega al menos una estrategia robusta."],
  [0.2,con.some(e=>(e.q||[]).length>=1&&(e.q||[]).length<=3)?1:0,"Tienes estrategias contingentes ligadas a escenarios específicos.","Agrega estrategias contingentes y marca en qué escenarios se activan."],
  [0.15,S.estr.length>=3?1:S.estr.length/3,`Propusiste ${S.estr.length} estrategias.`,"Propón al menos tres estrategias."],
  [0.2,S.ind.length>=3?1:S.ind.length?0.5:0,`Definiste ${S.ind.length} indicadores de alerta temprana.`,"Define al menos tres indicadores de alerta temprana."],
  [0.1,ratio(S.ind,e=>!junk(e.s)&&!junk(e.h)),"Cada indicador dice qué señal vigilar y hacia dónde apunta.","Completa la señal y el escenario hacia el que apunta cada indicador."],
  [0.1,ratio(S.ind,e=>!junk(e.u)),"Los indicadores tienen umbral.","Define un umbral para cada indicador: a partir de qué valor se activa la alerta."]]);
 const tot=out.reduce((a,c)=>a+c.w*c.score,0)/100;
 return {crit:out,score:tot,nota:Math.round(tot*50)/10};

<div><h5>Para mejorar</h5>${c.fix.length?`<ul class="fixl">${c.fix.map(g=>`<li>${esc(g)}</li>`).join("")}</ul>`:'<p class="mini">Nada pendiente. ¡Bien hecho!</p>'}${c.fix.length&&si>=0?`<button class="btn sec noprint" style="margin-top:8px" data-goto="${si}">Ir a ${esc(STEPS[si].t)}</button>`:""}</div></div></div>`;}).join("")}

<p class="mini">Niveles por criterio: Excelente (90% o más), Bueno (70% a 89%), Aceptable (50% a 69%), Insuficiente (menos de 50%). Nota = suma ponderada de los criterios, en escala de 0,0 a 5,0.</p></details>`;};

$("#bImport").onclick=()=>$("#fImport").click();
$("#fImport").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.vars)||!Array.isArray(d.M))throw 0;S=norm(d);teacher=false;save();render();msg("Trabajo abierto: "+f.name);}catch(err){tell("Ese archivo no es un trabajo de esta aplicación. Elige un .json descargado con «Descargar mi trabajo».");}};r.readAsText(f);e.target.value="";};
$("#bReset").onclick=()=>ask("Esto borra todo el ejercicio de este navegador. Si quieres conservarlo, descárgalo antes. ¿Empezar de cero?","Borrar y empezar").then(v=>{if(v){S=blank();teacher=false;save();render();}});
function loadExample(m){const doIt=()=>{S=m==="anglo"?exampleAnglo():example();S.step=0;teacher=false;save();render();msg("Ejemplo cargado: "+METHODS[m]+".");};
 if(S.vars.length&&!(S.meta.estudiante==="Ejemplo del docente"))ask("El ejemplo reemplaza tu trabajo actual. Si quieres conservarlo, descárgalo antes. ¿Cargar el ejemplo?","Cargar ejemplo").then(v=>{if(v)doIt();});else doIt();}
$("#bExample").onclick=()=>{if(!S.method){go(0);msg("Elige un método para ver su ejemplo resuelto.");return;}loadExample(S.method);};


/* ---------- Modo docente ---------- */
let teacher=false,subs=[];
function withState(d,f){const keep=S;try{S=d;setRoute();return f();}finally{S=keep;setRoute();}}
function summarize(d,name){return withState(d,()=>{const R=evalRubric();const done=STEPS.filter((s,i)=>!["rubrica","informe"].includes(s.id)&&stepDone(i)).length;const tot=STEPS.filter(s=>!["rubrica","informe"].includes(s.id)).length;
 return {file:name,d,est:d.meta.estudiante||"(sin nombre)",org:d.meta.empresa||"",met:METHODS[d.method]||"Sin método",nota:R.nota,lvl:lvl(R.score)[1],crit:R.crit,done:`${done} de ${tot}`,fecha:d.savedAt?new Date(d.savedAt).toLocaleString("es-CO"):"—"};});}
V.docente=()=>`<h2>Modo docente: revisar trabajos</h2>
<p class="lead">Carga los archivos .json que te entregaron los alumnos (puedes seleccionar varios a la vez). La aplicación recalcula la nota de cada uno con la rúbrica, así que no importa lo que diga su PDF.</p>
<div class="row" style="margin-bottom:16px"><button class="btn" id="tLoad">Cargar trabajos (.json)</button>${subs.length?`<button class="btn sec" id="tCsv">Descargar consolidado (.csv)</button><button class="btn sec" id="tClear">Limpiar lista</button>`:""}<button class="btn sec" id="tBack">Volver a mi ejercicio</button></div>
${subs.length?`<div class="tbl-wrap"><table class="mini"><thead><tr><th>Estudiante</th><th>Organización</th><th>Método</th><th>Pasos completos</th><th>Nota</th><th>Nivel</th><th>Guardado</th><th></th></tr></thead><tbody>
${subs.map((x,i)=>`<tr><td><b>${esc(x.est)}</b><br><span class="mini" style="color:var(--ink-3)">${esc(x.file)}</span></td><td>${esc(x.org)}</td><td>${esc(x.met)}</td><td>${x.done}</td><td><b>${fmtN(x.nota)}</b></td><td>${x.lvl}</td><td>${esc(x.fecha)}</td><td><button class="btn sec" data-open="${i}">Abrir</button></td></tr>`).join("")}
</tbody></table></div>
<h3>Detalle por criterio</h3><div class="tbl-wrap"><table class="mini"><thead><tr><th>Estudiante</th>${subs[0].crit.map(c=>`<th>${esc(c.name)} (${c.w}%)</th>`).join("")}</tr></thead><tbody>
${subs.map(x=>`<tr><td>${esc(x.est)}</td>${x.crit.map(c=>`<td>${Math.round(c.score*100)}%</td>`).join("")}</tr>`).join("")}</tbody></table></div>
<p class="mini">«Abrir» carga el trabajo del alumno en la aplicación para revisarlo paso a paso. Tu propio ejercicio en este navegador será reemplazado; descárgalo antes si lo necesitas.</p>`
:`<div class="empty">Aún no has cargado trabajos. Pide a cada alumno que use «Descargar mi trabajo (.json)» y te lo envíe por la plataforma del curso o por correo.</div>`}`;
function bindDocente(){
 $("#tLoad").onclick=()=>$("#fTeacher").click();
 $("#tBack").onclick=()=>{teacher=false;render();};
 const c=$("#tClear");if(c)c.onclick=()=>{subs=[];render();};
 const v=$("#tCsv");if(v)v.onclick=()=>{const q=t=>`"${String(t).replace(/"/g,'""')}"`;const head=["Estudiante","Archivo","Organización","Método","Pasos completos","Nota","Nivel","Guardado",...subs[0].crit.map(c=>c.name+" (%)")];
  const rows=subs.map(x=>[x.est,x.file,x.org,x.met,x.done,fmtN(x.nota),x.lvl,x.fecha,...x.crit.map(c=>Math.round(c.score*100))]);
  const csv="﻿"+[head,...rows].map(r=>r.map(q).join(";")).join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="notas_prospectiva.csv";a.click();};
 document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>ask(`Vas a abrir el trabajo de ${subs[+b.dataset.open].est}. Reemplaza lo que tengas en este navegador. ¿Continuar?`,"Abrir trabajo").then(ok=>{if(!ok)return;S=norm(JSON.parse(JSON.stringify(subs[+b.dataset.open].d)));S.step=0;teacher=false;save();render();msg("Revisando: "+subs[+b.dataset.open].est);}));
}
$("#bTeacher").onclick=()=>{teacher=true;render();window.scrollTo({top:0});};
$("#fTeacher").onchange=async e=>{const files=[...e.target.files];const bad=[];
 for(const f of files){try{const d=JSON.parse(await f.text());if(!Array.isArray(d.vars))throw 0;subs.push(summarize(norm(d),f.name));}catch(err){bad.push(f.name);}}
 subs.sort((a,b)=>a.est.localeCompare(b.est,"es"));e.target.value="";render();if(bad.length)tell("No se pudieron leer estos archivos: "+bad.join(", ")+". Deben ser .json descargados desde la aplicación.");};
